{% extends "base.html" %}
{% block title %}Kirish | Kokand Guidance{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-lg border-0 rounded-4">
        <div class="card-body p-4">
          <h2 class="mb-4 text-center fw-bold">Kirish</h2>
          <form method="post" novalidate>
            {% csrf_token %}
            {% if form.non_field_errors %}
              <div class="alert alert-danger">{{ form.non_field_errors }}</div>
            {% endif %}
            <div class="mb-3">
              <label for="id_username" class="form-label">Email</label>
              <input type="email" name="username" class="form-control form-control-lg" id="id_username" required autofocus placeholder="Email kiriting">
            </div>
            <div class="mb-3">
              <label for="id_password" class="form-label">Parol</label>
              <input type="password" name="password" class="form-control form-control-lg" id="id_password" required placeholder="Parol kiriting">
            </div>
            <button type="submit" class="btn btn-main w-100 py-2">Kirish</button>
          </form>
          <div class="text-center mt-3">
            <span>Hisobingiz yo‘qmi?</span> <a href="/auth/register/" class="fw-semibold">Ro‘yxatdan o‘tish</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
